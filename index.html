<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎓 英语小课堂</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{
    --sky1:#dff0ff; --sky2:#fff1dc; --card:#ffffff;
    --ink:#2b2d42; --soft:#6b7280; --accent:#ff7a59; --good:#22c55e; --line:#e6e9ef;
    --side1:#2b2d42; --side2:#3a3d5c; --blue:#4dabf7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Comic Sans MS","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--sky1),var(--sky2));
    color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .app{
    width:100%; max-width:1280px; background:var(--card); border-radius:28px;
    box-shadow:0 20px 50px rgba(0,0,0,.18); overflow:hidden; position:relative;
    display:flex; flex-direction:row; align-items:stretch;
    height:calc(100vh - 36px); min-height:600px;
  }

  /* ================= 侧边栏 ================= */
  .sidebar{
    flex:0 0 208px; background:linear-gradient(180deg,var(--side1),var(--side2)); color:#fff;
    display:flex; flex-direction:column; padding:16px 12px; gap:4px; overflow-y:auto;
  }
  .sidebar .brand{ font-size:16px; font-weight:800; text-align:center; line-height:1.45; margin-bottom:8px; opacity:.96; }
  .deck-hd{
    display:flex; align-items:center; gap:8px; width:100%; border:none; cursor:pointer;
    font-family:inherit; font-weight:800; font-size:14px; color:#fff;
    background:rgba(255,255,255,.10); border-radius:12px; padding:10px 11px; text-align:left; margin-top:7px;
    transition:background .15s;
  }
  .deck-hd:hover{ background:rgba(255,255,255,.2); }
  .deck-hd .nm{ flex:1; min-width:0; }
  .deck-hd .caret{ font-size:10px; opacity:.65; transition:transform .18s; }
  .deck-hd.open .caret{ transform:rotate(180deg); }
  .deck-hd.wrong{ background:rgba(255,106,136,.22); }
  .deck-hd.wrong:hover{ background:rgba(255,106,136,.4); }
  .deck-hd.wrong.active{ background:linear-gradient(90deg,#ff9a8b,#ff6a88); }
  .badge{ background:#ff6a88; border-radius:9px; font-size:11px; padding:1px 7px; font-weight:800; }
  .deck-body{ display:none; padding:3px 0 2px 4px; }
  .deck-body.open{ display:block; }
  .nav-btn{
    display:block; width:100%; border:none; cursor:pointer; margin-top:4px;
    font-family:inherit; font-weight:700; font-size:13px; color:#fff;
    background:rgba(255,255,255,.06); border-radius:10px; padding:8px 10px; text-align:left;
    transition:background .15s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,.16); }
  .nav-btn.active{ background:linear-gradient(90deg,#ff9a8b,#ff6a88); box-shadow:0 5px 12px rgba(255,106,136,.36); }
  .tools{ margin-top:auto; padding-top:14px; display:flex; flex-direction:column; gap:6px; }
  .tool-btn{
    display:flex; align-items:center; gap:8px; width:100%; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:12.5px; color:#fff;
    background:rgba(77,171,247,.22); border-radius:12px; padding:9px 11px; text-align:left;
    transition:background .15s;
  }
  .tool-btn:hover{ background:rgba(77,171,247,.42); }
  .sidebar .tip{ font-size:11px; opacity:.62; line-height:1.55; margin-top:10px; }

  /* ================= 主区 ================= */
  .col-main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; overflow-y:auto; }
  .col-side{ flex:0 0 40%; min-width:0; display:none; flex-direction:column; padding:14px 14px 14px 0; }
  h1{ margin:0; padding:15px 20px; font-size:21px; text-align:center;
      background:linear-gradient(90deg,#ff9a8b,#ff6a88,#ffb86c); color:#fff; letter-spacing:1px; }

  .stage{ padding:16px 20px 4px; text-align:center; }
  .globe{
    width:150px; height:150px; margin:2px auto 8px; border-radius:50%;
    position:relative; background:#eaf4ff; overflow:hidden;
    box-shadow: inset -16px -16px 34px rgba(0,0,0,.26), inset 10px 10px 26px rgba(255,255,255,.55), 0 10px 22px rgba(0,0,0,.2);
    animation: bob 3.4s ease-in-out infinite;
  }
  .globe img{ width:100%; height:100%; object-fit:contain; display:block; }
  .globe .emoji{ display:none; width:100%; height:100%; align-items:center; justify-content:center; font-size:82px; line-height:1; }
  .globe .shine{ position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.75), rgba(255,255,255,0) 38%),
               radial-gradient(circle at 70% 78%, rgba(0,0,0,.25), rgba(0,0,0,0) 45%); }
  .globe .sweep{ position:absolute; top:-40%; left:-40%; width:60%; height:180%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));
    transform:rotate(18deg); animation: sweep 4.5s linear infinite; pointer-events:none; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes sweep{ 0%{left:-50%} 100%{left:120%} }

  .pos{ display:inline-block; font-size:12px; color:#fff; background:#868e96; border-radius:10px; padding:2px 9px; margin-bottom:5px; }
  .pos.v{ background:#4dabf7; } .pos.adj{ background:#22c55e; } .pos.phr{ background:#f59e0b; }
  .word{ font-size:40px; font-weight:800; letter-spacing:.5px; margin:2px 0 0; line-height:1.2; }
  .ipa{ font-size:19px; color:var(--soft); margin:4px 0; }
  .ipa b{ color:var(--accent); font-weight:700; }
  .zh{ font-size:21px; color:var(--ink); margin-bottom:4px; }
  .act-hint{ font-size:14px; color:#e8590c; font-weight:700; margin:4px 0 0; }

  .controls{ display:flex; gap:10px; justify-content:center; align-items:center; margin:8px 0 2px; flex-wrap:wrap; }
  .btn{
    border:none; border-radius:14px; padding:10px 16px; font-size:16px; cursor:pointer;
    font-family:inherit; font-weight:700; color:#fff; background:#ff9a8b;
    box-shadow:0 4px 0 #e07a6c; transition:transform .05s;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #e07a6c; }
  .btn.speak{ background:#4dabf7; box-shadow:0 4px 0 #3b8fd6; }
  .btn.ghost{ background:#fff; color:var(--soft); box-shadow:0 4px 0 #d7dbe3; }
  .btn.small{ font-size:13px; padding:8px 12px; }

  .mic{
    display:block; margin:8px auto 4px; width:84px; height:84px; border-radius:50%;
    border:none; cursor:pointer; color:#fff; font-size:36px; line-height:1;
    background:radial-gradient(circle at 35% 30%,#ff9a8b,#ff6a88);
    box-shadow:0 8px 20px rgba(255,106,136,.45); transition:transform .08s;
  }
  .mic:active{ transform:scale(.94); }
  .mic.active{ animation: micpulse 1.1s ease-out infinite; background:radial-gradient(circle at 35% 30%,#ff6a88,#e23b6d); }
  @keyframes micpulse{ 0%{box-shadow:0 0 0 0 rgba(255,106,136,.55)} 100%{box-shadow:0 0 0 28px rgba(255,106,136,0)} }
  .listening{ text-align:center; font-size:15px; color:#ff6a88; font-weight:700; margin:4px 0; min-height:20px; }
  .listening b{ color:var(--accent); }
  .heard{ text-align:center; min-height:20px; font-size:15px; color:var(--soft); margin-top:2px; }
  .heard b{ color:var(--ink); }
  .feedback{ text-align:center; min-height:24px; margin-top:6px; font-size:17px; font-weight:800; }
  .feedback.ok{ color:var(--good); } .feedback.bad{ color:#ff6b6b; }

  .practice{ padding:4px 20px 18px; }
  .progress{ text-align:center; font-size:14px; color:var(--soft); margin-bottom:6px; }
  .nav{ display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .hint-line{ text-align:center; font-size:14px; color:var(--soft); margin-top:4px; min-height:20px; }
  .steps{ text-align:center; font-size:12.5px; color:var(--soft); margin-top:10px; }
  .fallback{ margin-top:8px; }
  .fallback input{ width:100%; max-width:420px; font-size:20px; padding:11px 14px; border-radius:14px;
    border:2px solid var(--line); text-align:center; font-family:inherit; outline:none; }
  .fallback input:focus{ border-color:#4dabf7; }

  /* ================= 世界地图 ================= */
  .map-panel{ border-radius:18px; overflow:hidden; background:#dff1ff; border:1px solid var(--line); flex:1; display:flex; }
  .map-panel svg{ display:block; width:100%; height:100%; }
  .country{ fill:#bfe0ff; stroke:#fff; stroke-width:.6; }
  .country.active{ fill:#ff8787; stroke:#ff5252; stroke-width:1.2; }
  .pin{ fill:#ffd43b; stroke:#fff; stroke-width:1.5; }
  .pin-halo{ fill:#ffd43b; opacity:.35; animation: pulse 1.6s ease-out infinite; transform-origin:center; }
  .pin-label{ font-size:11px; font-weight:700; fill:#1d3557; text-anchor:middle; paint-order:stroke; stroke:#fff; stroke-width:2.4px; }
  @keyframes pulse{ 0%{transform:scale(.6);opacity:.5} 100%{transform:scale(2.4);opacity:0} }

  /* ================= 闭眼听读 ================= */
  .blind{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    flex:1 1 auto; background:#23243a; color:#fff; padding:30px;
  }
  .blind.on{ display:flex; }
  .blind .b-title{ font-size:16px; opacity:.8; margin-bottom:6px; }
  .blind .b-sub{ font-size:13px; opacity:.55; margin-bottom:26px; text-align:center; line-height:1.6; }
  .blind .b-mic{
    width:150px; height:150px; border-radius:50%; border:none; cursor:pointer; color:#fff; font-size:60px;
    background:radial-gradient(circle at 35% 30%,#ff9a8b,#ff6a88);
    box-shadow:0 8px 24px rgba(255,106,136,.5); transition:transform .08s;
  }
  .blind .b-mic:active{ transform:scale(.95); }
  .blind .b-mic.active{ animation: micpulse 1.1s ease-out infinite; background:radial-gradient(circle at 35% 30%,#ff6a88,#e23b6d); }
  .blind .b-status{ font-size:18px; font-weight:800; margin-top:22px; min-height:26px; text-align:center; }
  .blind .b-status.ok{ color:#51cf66; } .blind .b-status.bad{ color:#ff8787; }
  .blind .b-heard{ font-size:14px; opacity:.7; margin-top:8px; min-height:20px; text-align:center; }
  .blind .b-row{ display:flex; gap:14px; margin-top:24px; flex-wrap:wrap; justify-content:center; }
  .blind .b-btn{ border:none; border-radius:14px; padding:11px 20px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit; color:#fff; background:rgba(255,255,255,.16); }
  .blind .b-btn.speak{ background:#4dabf7; }

  /* ================= 庆祝 / 开始 / 弹窗 ================= */
  #cheer{ position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; background:rgba(255,255,255,.82); z-index:15; }
  #cheer.show{ display:flex; animation: pop .3s ease; }
  #cheer .big{ font-size:46px; } #cheer .txt{ font-size:26px; font-weight:800; color:var(--good); margin-top:6px; }
  @keyframes pop{ from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
  .confetti{ position:absolute; top:-10px; width:10px; height:14px; opacity:.9; border-radius:2px; }

  #start{ position:absolute; inset:0; z-index:30; background:rgba(43,45,66,.93);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; padding:30px; }
  #start h2{ font-size:26px; margin:0 0 6px; }
  #start p{ font-size:15px; opacity:.85; margin:0 0 18px; line-height:1.7; }
  #start .btn{ font-size:20px; padding:14px 30px; }

  .modal{ position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
    background:rgba(43,45,66,.62); padding:20px; }
  .modal.show{ display:flex; }
  .modal-box{ background:#fff; border-radius:22px; padding:22px 24px; width:100%; max-width:440px;
    max-height:86%; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.3); text-align:center; }
  .m-title{ font-size:20px; font-weight:800; margin-bottom:10px; }
  .m-body{ font-size:15px; color:var(--soft); line-height:1.8; }
  .m-sub{ font-size:13px; color:var(--soft); text-align:left; margin:16px 0 6px; font-weight:700; }
  .m-count{ font-size:52px; font-weight:800; color:var(--blue); margin:12px 0 4px; }
  .m-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
  .s-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px; }
  .s-card{ background:#f6f8fb; border-radius:12px; padding:10px 4px; }
  .s-num{ font-size:22px; font-weight:800; color:var(--ink); }
  .s-lbl{ font-size:10.5px; color:var(--soft); margin-top:2px; line-height:1.3; }
  .s-row{ display:flex; align-items:center; gap:8px; text-align:left; font-size:14px;
    padding:7px 10px; border-bottom:1px solid var(--line); }
  .s-row b{ min-width:96px; }
  .s-ipa{ color:var(--accent); font-size:12px; flex:1; }
  .s-zh{ color:var(--soft); font-size:12px; }
  .s-n{ color:#ff6b6b; font-size:12px; font-weight:700; }
  .s-empty{ font-size:14px; color:var(--soft); padding:14px; }

  #toast{ position:absolute; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
    background:rgba(43,45,66,.92); color:#fff; font-size:14px; padding:10px 18px; border-radius:14px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:35; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ================= 窄屏 ================= */
  @media (max-width: 900px){
    body{ padding:0; }
    .app{ flex-direction:column; height:auto; min-height:100vh; border-radius:0; }
    .sidebar{ flex:none; width:100%; max-height:none; padding:12px; }
    .tools{ margin-top:12px; flex-direction:row; flex-wrap:wrap; }
    .tool-btn{ width:auto; }
    .sidebar .tip{ display:none; }
    .col-main{ overflow:visible; }
    .col-side{ flex:none; width:100%; padding:0 14px 14px; height:230px; }
    .globe{ width:120px; height:120px; }
    .word{ font-size:34px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <div class="brand">🎓<br>英语小课堂</div>
    <div id="navRoot"></div>
    <div class="tools">
      <button class="tool-btn" id="modeBtn">🌗 闭眼听读模式</button>
      <button class="tool-btn" id="printBtn">🖨️ 打印本组词卡</button>
      <button class="tool-btn" id="statsBtn">📊 学习记录</button>
    </div>
    <div class="tip">听发音 → 大声读出来。闭眼听读最护眼，每 10 分钟会提醒休息。</div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="col-main">
    <h1 id="pageTitle">英语小课堂</h1>

    <div class="stage" id="seeStage">
      <div class="globe" id="globe" style="display:none">
        <img id="flagImg" alt="flag" />
        <div class="emoji" id="flagEmoji"></div>
        <div class="sweep"></div>
        <div class="shine"></div>
      </div>
      <div class="pos" id="posTag" style="display:none"></div>
      <div class="word" id="en">Hello</div>
      <div class="ipa">音标：<b id="ipa">/həˈləʊ/</b></div>
      <div class="zh" id="zh">你好</div>
      <div class="act-hint" id="actHint" style="display:none">🤸 这个词可以演出来！</div>

      <div class="controls">
        <button class="btn speak" id="speakBtn">🔊 听发音</button>
        <button class="btn ghost" id="hintBtn">💡 提示</button>
      </div>
      <button class="mic" id="micBtn" title="点击后读出英文">🎤</button>
      <div class="listening" id="listening" style="display:none">🎧 我在听… 请说出：<b id="listenWord"></b></div>
      <div class="heard" id="heard"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="blind" id="blindStage">
      <div class="b-title">🌗 闭眼听读模式</div>
      <div class="b-sub">闭上眼睛，先听发音，再大声跟读。<br>不用看屏幕，保护小眼睛。</div>
      <button class="b-mic" id="bMicBtn">🎤</button>
      <div class="b-status" id="bStatus">点上面的麦克风开始</div>
      <div class="b-heard" id="bHeard"></div>
      <div class="b-row">
        <button class="b-btn speak" id="bSpeakBtn">🔊 再听一次</button>
        <button class="b-btn" id="bNextBtn">➡️ 下一个</button>
      </div>
    </div>

    <div class="practice">
      <div class="progress" id="progress">第 1 / 1 个</div>
      <div class="hint-line" id="hintLine"></div>
      <div class="fallback" id="fallback" style="display:none">
        <input id="answer" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="（语音不可用）在这里拼出英文…" />
      </div>
      <div class="nav">
        <button class="btn ghost" id="prevBtn">⬅️ 上一个</button>
        <button class="btn ghost" id="shuffleBtn">🔀 打乱</button>
        <button class="btn ghost" id="nextBtn">下一个 ➡️</button>
      </div>
      <div class="steps" id="steps">👂 听发音 → 🎤 读出英文 → 🎉 答对就进入下一个　（空格=听发音，←→=翻词）</div>
    </div>
  </main>

  <!-- ============ 地图列（有地理信息时显示） ============ -->
  <aside class="col-side" id="colSide">
    <div class="map-panel">
      <svg id="worldmap" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </aside>

  <div id="cheer"><div class="big">🎉🎊🌟</div><div class="txt">太棒了！</div></div>

  <div id="start">
    <h2>👋 准备好了吗？</h2>
    <p>左边选一个板块，听发音，把英文大声读出来。<br>每学 10 分钟，我会提醒你看看远处休息一下。</p>
    <button class="btn" id="startBtn">🚀 开始学习</button>
  </div>

  <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
  <div id="toast"></div>
</div>

<script src="decks/countries.js"></script>
<script src="decks/sh-grade4.js"></script>
<script>
/* =====================================================================
 *  英语小课堂 · 内核
 *  想加新板块？在 decks/ 下新建一个 js，push 到 window.DECKS，
 *  再在上面加一行 <script src="decks/xxx.js"> 就行。
 * ===================================================================== */

/* ---------------- 基础工具 ---------------- */
const DECKS = window.DECKS || [];
const $ = id => document.getElementById(id);
const norm = s => (s || '').toLowerCase().replace(/[^a-z]/g, '');
const POS_LABEL = { v:'动词', adj:'形容词', phr:'短语', n:'名词' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const flagEmoji = iso => iso.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
const todayStr = () => new Date().toLocaleDateString('sv');

/* ---------------- 学习记忆（localStorage） ---------------- */
const SKEY = 'elearn.v1';
let DB = (function () {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; } catch (e) { d = {}; }
  d.stats = d.stats || {};
  d.day = d.day || {};
  if (d.day.date !== todayStr()) d.day = { date: todayStr(), ok: 0, bad: 0, sec: 0, seen: [] };
  return d;
})();
function saveDB() { try { localStorage.setItem(SKEY, JSON.stringify(DB)); } catch (e) {} }
function sKey(deckId, en) { return deckId + '::' + en; }
function record(deckId, w, good) {
  if (!w || !w.en) return;
  const k = sKey(deckId, w.en);
  const s = DB.stats[k] || (DB.stats[k] = { ok: 0, bad: 0 });
  s.deck = deckId;
  s.w = { en: w.en, ipa: w.ipa, zh: w.zh, pos: w.pos || '', geo: w.geo || null };
  if (good) { s.ok++; DB.day.ok++; } else { s.bad++; DB.day.bad++; }
  s.ts = Date.now();
  if (DB.day.seen.indexOf(k) < 0) DB.day.seen.push(k);
  saveDB(); paintWrongBadge();
}
/* 判定为「还没掌握」：读错过，且读错次数 >= 读对次数 */
function wrongStats() {
  return Object.keys(DB.stats).map(k => DB.stats[k])
    .filter(s => s && s.w && s.bad > 0 && s.bad >= s.ok)
    .sort((a, b) => (b.bad - b.ok) - (a.bad - a.ok));
}

/* ---------------- 发音（TTS） ---------------- */
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) {} }
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text, rate) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.85; u.pitch = 1.05;
    const v = voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------------- 状态 ---------------- */
let deckIdx = 0, groupIdx = 0, wrongMode = false;
const WRONG = { id: 'wrong', name: '错词复习', icon: '🔁', words: [] };
let order = [], pos = 0, locked = false, mode = 'see', started = false;
const openSet = new Set([0]);

const deck = () => DECKS[deckIdx];
const group = () => wrongMode ? WRONG : deck().groups[groupIdx];
const words = () => group().words;
const current = () => words()[order[pos]] || { en: '', ipa: '', zh: '' };
const curDeckId = () => wrongMode ? (current()._deck || 'wrong') : deck().id;
const groupHasGeo = () => words().some(w => w && w.geo);
function resetOrder() { order = words().map((_, i) => i); pos = 0; }

/* ---------------- 侧边栏 ---------------- */
function buildNav() {
  const root = $('navRoot'); root.innerHTML = '';
  DECKS.forEach((d, di) => {
    const hd = document.createElement('button');
    hd.className = 'deck-hd' + (openSet.has(di) ? ' open' : '');
    hd.innerHTML = '<span>' + d.icon + '</span><span class="nm">' + esc(d.name) + '</span><span class="caret">▼</span>';
    hd.addEventListener('click', () => { openSet.has(di) ? openSet.delete(di) : openSet.add(di); buildNav(); });
    root.appendChild(hd);

    const body = document.createElement('div');
    body.className = 'deck-body' + (openSet.has(di) ? ' open' : '');
    d.groups.forEach((g, gi) => {
      const b = document.createElement('button');
      b.className = 'nav-btn' + (!wrongMode && di === deckIdx && gi === groupIdx ? ' active' : '');
      b.textContent = (g.icon ? g.icon + ' ' : '') + g.name;
      b.addEventListener('click', () => { location.hash = '#/' + d.id + '/' + g.id; });
      body.appendChild(b);
    });
    root.appendChild(body);
  });

  const wb = document.createElement('button');
  wb.className = 'deck-hd wrong' + (wrongMode ? ' active' : '');
  wb.innerHTML = '<span>🔁</span><span class="nm">只练错词</span><span class="badge" id="wrongBadge">0</span>';
  wb.addEventListener('click', () => { location.hash = '#/wrong'; });
  root.appendChild(wb);
  paintWrongBadge();
}
function paintWrongBadge() {
  const el = $('wrongBadge'); if (!el) return;
  const n = wrongStats().length;
  el.textContent = n; el.style.display = n ? 'inline-block' : 'none';
}

/* ---------------- 路由 #/板块/分组 ---------------- */
function applyHash() {
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'wrong') {
    const list = wrongStats();
    if (!list.length) {
      toast('还没有错词，先去学几组单词吧 😊');
      wrongMode = false;
      history.replaceState(null, '', '#/' + deck().id + '/' + deck().groups[groupIdx].id);
    } else {
      WRONG.words = list.map(s => Object.assign({}, s.w, { _deck: s.deck }));
      wrongMode = true;
    }
  } else {
    let di = DECKS.findIndex(d => d.id === parts[0]); if (di < 0) di = 0;
    let gi = DECKS[di].groups.findIndex(g => g.id === parts[1]); if (gi < 0) gi = 0;
    wrongMode = false; deckIdx = di; groupIdx = gi; openSet.add(di);
  }
  resetOrder(); buildNav(); render();
}

/* ---------------- 渲染 ---------------- */
function render() {
  const c = current();
  locked = false;
  $('pageTitle').textContent = wrongMode ? '🔁 错词复习' : (deck().icon + ' ' + group().name);

  const hasGeo = !!c.geo;
  $('globe').style.display = hasGeo ? 'block' : 'none';
  if (hasGeo) {
    const img = $('flagImg'), em = $('flagEmoji');
    img.style.display = 'block'; em.style.display = 'none';
    img.onerror = () => { img.style.display = 'none'; em.style.display = 'flex'; em.textContent = flagEmoji(c.geo.iso); };
    img.src = 'https://flagcdn.com/w320/' + c.geo.iso + '.png';
  }

  const pt = $('posTag');
  if (c.pos) { pt.style.display = 'inline-block'; pt.className = 'pos ' + c.pos; pt.textContent = POS_LABEL[c.pos] || c.pos; }
  else pt.style.display = 'none';

  $('en').textContent = c.en;
  $('ipa').textContent = c.ipa ? '/' + c.ipa + '/' : '';
  $('zh').textContent = c.zh;
  $('actHint').style.display = (c.pos === 'v' || c.pos === 'adj') ? 'block' : 'none';
  $('progress').textContent = '第 ' + (pos + 1) + ' / ' + words().length + ' 个';
  setFb('', ''); $('hintLine').textContent = ''; $('heard').textContent = '';
  const ans = $('answer'); if (ans) { ans.value = ''; ans.className = ''; }
  stopMicUI();

  const showMap = groupHasGeo();
  $('colSide').style.display = showMap ? 'flex' : 'none';
  if (showMap) { ensureMap(); renderMap(); }

  $('bStatus').textContent = '点上面的麦克风开始'; $('bStatus').className = 'b-status';
  $('bHeard').textContent = ''; $('bMicBtn').classList.remove('active');

  if (started) speak(c.en);
}
function setFb(txt, cls) { const f = $('feedback'); f.textContent = txt; f.className = 'feedback' + (cls ? ' ' + cls : ''); }
function setB(txt, cls) { const f = $('bStatus'); f.textContent = txt; f.className = 'b-status' + (cls ? ' ' + cls : ''); }

/* ---------------- 世界地图（按需加载） ---------------- */
const MAP_W = 800, MAP_H = 400;
let mapReady = false, mapPending = false, projection, path, gMap, gPin, pin, pinHalo, pinLabel;
function ensureMap() {
  if (mapReady || mapPending) return;
  if (typeof d3 === 'undefined' || typeof topojson === 'undefined') return;
  mapPending = true;
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r => r.json())
    .then(topo => {
      const features = topojson.feature(topo, topo.objects.countries).features;
      projection = d3.geoEquirectangular().fitSize([MAP_W, MAP_H], { type: 'Sphere' });
      path = d3.geoPath(projection);
      const svg = d3.select('#worldmap'); svg.selectAll('*').remove();
      gMap = svg.append('g');
      gMap.selectAll('path').data(features).join('path').attr('d', path).attr('class', 'country');
      gPin = svg.append('g');
      pinHalo = gPin.append('circle').attr('class', 'pin-halo').attr('r', 9);
      pin = gPin.append('circle').attr('class', 'pin').attr('r', 5);
      pinLabel = gPin.append('text').attr('class', 'pin-label');
      mapReady = true; mapPending = false; renderMap();
    })
    .catch(e => { mapPending = false; console.warn('map load failed', e); });
}
function renderMap() {
  if (!mapReady) return;
  const c = current();
  if (!c.geo) { gPin.attr('display', 'none'); gMap.selectAll('path').attr('class', 'country'); return; }
  gPin.attr('display', null);
  gMap.selectAll('path').attr('class', d => d.properties.name === c.geo.mapName ? 'country active' : 'country');
  const p = projection([c.geo.lon, c.geo.lat]);
  if (p) {
    pin.attr('cx', p[0]).attr('cy', p[1]);
    pinHalo.attr('cx', p[0]).attr('cy', p[1]);
    pinLabel.attr('x', p[0]).attr('y', p[1] - 12).text(c.en);
  }
}

/* ---------------- 判定 ---------------- */
function check(txt) {
  if (locked) return;
  const c = current(), t = norm(txt), target = norm(c.en);
  const good = !!t && target && (t === target || t.indexOf(target) >= 0);
  if (good) {
    locked = true;
    record(curDeckId(), c, true);
    if (mode === 'see') setFb('✅ 读对啦！', 'ok'); else setB('✅ 读对啦！', 'ok');
    cheer();
    setTimeout(() => { if (pos < words().length - 1) { pos++; render(); } else finish(); }, 1300);
  } else {
    record(curDeckId(), c, false);
    if (mode === 'see') { setFb('再试试看～ 跟着发音读', 'bad'); if (!$('hintLine').textContent) showHint(); }
    else setB('再试试～ 跟着发音读', 'bad');
  }
}
function showHint() {
  const first = (current().en || '').replace(/[^A-Za-z]/g, '')[0] || '';
  $('hintLine').textContent = '💡 提示：第一个字母是「' + first.toUpperCase() + '」';
}

/* ---------------- 语音识别 ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false;
function stopMicUI() { $('micBtn').classList.remove('active'); $('listening').style.display = 'none'; }
if (SR) {
  recog = new SR();
  recog.lang = 'en-US'; recog.interimResults = false; recog.maxAlternatives = 1;
  recog.onstart = () => {
    listening = true;
    if (mode === 'see') { $('micBtn').classList.add('active'); $('listening').style.display = 'block'; $('listenWord').textContent = current().en; $('heard').textContent = ''; }
    else { $('bMicBtn').classList.add('active'); setB('🎧 我在听…', ''); $('bHeard').textContent = ''; }
  };
  recog.onresult = e => {
    const txt = e.results[0][0].transcript;
    if (mode === 'see') $('heard').innerHTML = '我听到：<b>' + esc(txt) + '</b>';
    else $('bHeard').textContent = '我听到：' + txt;
    check(txt);
  };
  recog.onerror = e => {
    const msg = (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      ? '麦克风没打开权限哦，请在浏览器允许使用麦克风。'
      : (e.error === 'no-speech' ? '没听清，再试一次吧' : '语音出错了：' + e.error);
    if (mode === 'see') $('heard').textContent = msg; else $('bHeard').textContent = msg;
  };
  recog.onend = () => { listening = false; stopMicUI(); $('bMicBtn').classList.remove('active'); };
} else {
  $('micBtn').style.display = 'none';
  $('fallback').style.display = 'block';
  $('hintLine').textContent = '当前浏览器不支持语音识别，可用键盘拼写代替。';
}
function toggleMic() {
  if (!recog) return;
  if (listening) { try { recog.stop(); } catch (e) {} return; }
  try { recog.start(); } catch (e) {}
}

/* ---------------- 庆祝 / 完成 / 打乱 ---------------- */
function cheer() {
  const el = $('cheer'); el.classList.add('show');
  for (let i = 0; i < 18; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = ['#ff7a59','#4dabf7','#ffd43b','#22c55e','#ff6a88'][i % 5];
    c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    el.appendChild(c);
    const dur = 800 + Math.random() * 700;
    c.animate([{ transform: 'translateY(0) rotate(0)', opacity: 1 },
               { transform: 'translateY(' + (200 + Math.random() * 120) + 'px) rotate(360deg)', opacity: 0 }],
      { duration: dur, easing: 'ease-in' });
    setTimeout(() => c.remove(), dur);
  }
  setTimeout(() => el.classList.remove('show'), 1250);
}
function finish() {
  const el = $('cheer');
  el.querySelector('.big').textContent = '🏆🎉🌟';
  el.querySelector('.txt').textContent = wrongMode ? '错词都练完啦！' : '这一组学完啦！';
  el.classList.add('show');
  speak(wrongMode ? 'Great job! No more mistakes!' : 'Great job! You finished this group!');
  setTimeout(() => {
    el.classList.remove('show');
    el.querySelector('.big').textContent = '🎉🎊🌟';
    el.querySelector('.txt').textContent = '太棒了！';
    if (wrongMode) {
      const list = wrongStats();
      if (!list.length) {
        toast('错词清空啦，真棒！');
        wrongMode = false; buildNav(); resetOrder(); render();
        history.replaceState(null, '', '#/' + deck().id + '/' + deck().groups[groupIdx].id);
        return;
      }
      WRONG.words = list.map(s => Object.assign({}, s.w, { _deck: s.deck }));
    }
    resetOrder(); render();
  }, 2500);
}
function shuffle() {
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; render();
}
const next = () => { if (pos < words().length - 1) { pos++; render(); } };
const prev = () => { if (pos > 0) { pos--; render(); } };

/* ---------------- 模式切换 ---------------- */
function switchMode() {
  mode = (mode === 'see') ? 'blind' : 'see';
  $('modeBtn').textContent = (mode === 'see') ? '🌗 闭眼听读模式' : '👀 回到看词模式';
  $('blindStage').classList.toggle('on', mode === 'blind');
  $('seeStage').style.display = (mode === 'see') ? 'block' : 'none';
  $('steps').style.display = (mode === 'see') ? 'block' : 'none';
  $('colSide').style.display = (mode === 'blind') ? 'none' : ($('colSide').style.display);
  render();
}

/* ---------------- 弹窗 ---------------- */
let modalCleanup = null;
function openModal(html) { $('modalBox').innerHTML = html; $('modal').classList.add('show'); }
function closeModal() { $('modal').classList.remove('show'); if (modalCleanup) { modalCleanup(); modalCleanup = null; } }
$('modal').addEventListener('click', e => {
  const act = e.target.getAttribute && e.target.getAttribute('data-act');
  if (act === 'close' || act === 'eye-done') { closeModal(); return; }
  if (act === 'go-wrong') { closeModal(); location.hash = '#/wrong'; return; }
  if (act === 'reset-stats') {
    if (confirm('确定清空全部学习记录吗？此操作无法撤销。')) {
      DB = { stats: {}, day: { date: todayStr(), ok: 0, bad: 0, sec: 0, seen: [] } };
      saveDB(); paintWrongBadge(); closeModal(); toast('学习记录已清空');
    }
    return;
  }
  if (e.target === $('modal')) closeModal();
});
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------------- 护眼计时（每 10 分钟） ---------------- */
const EYE_MS = 10 * 60 * 1000;
let studyStart = 0, tickId = null, eyeShown = false;
function startClock() {
  studyStart = Date.now(); eyeShown = false;
  if (tickId) clearInterval(tickId);
  tickId = setInterval(() => {
    DB.day.sec += 15; saveDB();
    if (!eyeShown && Date.now() - studyStart >= EYE_MS) { eyeShown = true; eyeBreak(); }
  }, 15000);
}
function eyeBreak() {
  speak('Time for a break. Look far away!', 0.9);
  let left = 20;
  openModal(
    '<div class="m-title">🌿 该休息一下啦</div>' +
    '<div class="m-body">已经学了 10 分钟。<br>抬起头，看看窗外最远的地方，<br>慢慢数 20 秒再回来。</div>' +
    '<div class="m-count" id="mCount">20</div>' +
    '<div class="m-row"><button class="btn" data-act="eye-done">我看完远处了 👀</button></div>'
  );
  const iv = setInterval(() => {
    left--;
    const el = $('mCount');
    if (el) el.textContent = left > 0 ? left : '好啦！';
    if (left <= 0) clearInterval(iv);
  }, 1000);
  modalCleanup = () => { clearInterval(iv); studyStart = Date.now(); eyeShown = false; };
}

/* ---------------- 学习记录 ---------------- */
function showStats() {
  const d = DB.day, mins = Math.round(d.sec / 60);
  const list = wrongStats().slice(0, 12);
  const rows = list.length
    ? list.map(s => '<div class="s-row"><b>' + esc(s.w.en) + '</b><span class="s-ipa">/' + esc(s.w.ipa) + '/</span>' +
        '<span class="s-zh">' + esc(s.w.zh) + '</span><span class="s-n">错 ' + s.bad + '</span></div>').join('')
    : '<div class="s-empty">还没有错词，太棒了 🎉</div>';
  openModal(
    '<div class="m-title">📊 学习记录</div>' +
    '<div class="s-grid">' +
      '<div class="s-card"><div class="s-num">' + mins + '</div><div class="s-lbl">今天学习<br>(分钟)</div></div>' +
      '<div class="s-card"><div class="s-num">' + d.seen.length + '</div><div class="s-lbl">今天练过<br>的词</div></div>' +
      '<div class="s-card"><div class="s-num">' + d.ok + '</div><div class="s-lbl">今天<br>读对</div></div>' +
      '<div class="s-card"><div class="s-num">' + Object.keys(DB.stats).length + '</div><div class="s-lbl">累计<br>学过</div></div>' +
    '</div>' +
    '<div class="m-sub">还需要复习的词</div>' + rows +
    '<div class="m-row">' +
      (list.length ? '<button class="btn" data-act="go-wrong">🔁 现在练错词</button>' : '') +
      '<button class="btn ghost" data-act="close">关闭</button>' +
      '<button class="btn ghost small" data-act="reset-stats">清空记录</button>' +
    '</div>'
  );
}

/* ---------------- 打印词卡 ---------------- */
function printGroup() {
  const g = group(), title = wrongMode ? '错词复习' : (deck().name + ' · ' + g.name);
  const cards = g.words.map(w => {
    const tag = w.pos ? '<span class="ct">' + (POS_LABEL[w.pos] || w.pos) + '</span>' : '';
    return '<div class="card">' + tag + '<div class="ce">' + esc(w.en) + '</div>' +
           '<div class="ci">/' + esc(w.ipa) + '/</div><div class="cz">' + esc(w.zh) + '</div></div>';
  }).join('');
  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>' + esc(title) + ' 词卡</title>' +
    '<style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;margin:20px;color:#2b2d42;}' +
    'h2{text-align:center;margin:0 0 16px;}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}' +
    '.card{border:2px solid #e6e9ef;border-radius:14px;padding:14px;text-align:center;page-break-inside:avoid;min-height:96px;}' +
    '.ct{display:inline-block;font-size:11px;color:#fff;background:#868e96;border-radius:8px;padding:1px 7px;margin-bottom:4px;}' +
    '.ce{font-size:20px;font-weight:800;margin:2px 0;}.ci{font-size:13px;color:#ff7a59;}.cz{font-size:14px;color:#444;}' +
    '@media print{body{margin:10mm;}}</style></head><body>' +
    '<h2>📚 ' + esc(title) + ' · 单词卡</h2><div class="grid">' + cards + '</div>' +
    '<' + 'script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/' + 'script></body></html>';
  const w = window.open('', '_blank');
  if (!w) { toast('浏览器拦截了新窗口，请允许弹窗'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

/* ---------------- 事件 ---------------- */
$('micBtn').addEventListener('click', toggleMic);
$('bMicBtn').addEventListener('click', toggleMic);
$('speakBtn').addEventListener('click', () => speak(current().en));
$('bSpeakBtn').addEventListener('click', () => speak(current().en));
$('hintBtn').addEventListener('click', showHint);
$('prevBtn').addEventListener('click', prev);
$('nextBtn').addEventListener('click', next);
$('bNextBtn').addEventListener('click', next);
$('shuffleBtn').addEventListener('click', shuffle);
$('modeBtn').addEventListener('click', switchMode);
$('printBtn').addEventListener('click', printGroup);
$('statsBtn').addEventListener('click', showStats);
$('answer').addEventListener('keydown', e => { if (e.key === 'Enter') check($('answer').value); });

document.addEventListener('keydown', e => {
  if (!started) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if ($('modal').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
  if (e.code === 'Space') { e.preventDefault(); speak(current().en); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
});

window.addEventListener('hashchange', applyHash);
$('startBtn').addEventListener('click', () => {
  $('start').style.display = 'none';
  started = true; startClock(); resetOrder(); render();
});

/* ---------------- 启动 ---------------- */
if (!DECKS.length) {
  $('pageTitle').textContent = '⚠️ 没有加载到词库';
  $('start').style.display = 'none';
} else {
  buildNav();
  applyHash();
}
</script>
</body>
