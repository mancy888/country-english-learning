<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🌍 国家 & 首都英语小课堂</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{
    --sky1:#aee4ff; --sky2:#ffe9a8; --card:#ffffff;
    --ink:#2b2d42; --soft:#6b7280; --accent:#ff7a59; --good:#22c55e; --line:#e6e9ef;
    --side1:#2b2d42; --side2:#3a3d5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Comic Sans MS","Yuanti SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--sky1),var(--sky2));
    color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .app{
    width:100%; max-width:1280px; background:var(--card); border-radius:28px;
    box-shadow:0 20px 50px rgba(0,0,0,.18); overflow:hidden; position:relative;
    display:flex; flex-direction:row; align-items:stretch;
    max-height: calc(100vh - 36px);
  }

  /* ---------- 侧边栏 ---------- */
  .sidebar{
    flex:0 0 174px; background:linear-gradient(180deg,var(--side1),var(--side2)); color:#fff;
    display:flex; flex-direction:column; padding:18px 12px; gap:10px;
  }
  .sidebar .brand{ font-size:15px; font-weight:800; text-align:center; line-height:1.45; margin-bottom:6px; opacity:.95; }
  .sidebar .nav-btn{
    display:flex; align-items:center; gap:9px; width:100%; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:15px; color:#fff;
    background:rgba(255,255,255,.08); border-radius:14px; padding:13px 14px; text-align:left;
    transition:background .15s, box-shadow .15s;
  }
  .sidebar .nav-btn:hover{ background:rgba(255,255,255,.18); }
  .sidebar .nav-btn.active{ background:linear-gradient(90deg,#ff9a8b,#ff6a88); box-shadow:0 6px 14px rgba(255,106,136,.4); }
  .sidebar .nav-btn .ico{ font-size:20px; }
  .sidebar .tip{ margin-top:auto; font-size:12px; opacity:.7; line-height:1.55; }

  .col-left{ flex:1 1 50%; min-width:0; display:flex; flex-direction:column; overflow-y:auto; padding-right:4px; }
  .col-right{ flex:1 1 42%; min-width:0; display:flex; flex-direction:column; padding:14px 14px 14px 0; }
  h1{
    margin:0; padding:16px 20px; font-size:22px; text-align:center;
    background:linear-gradient(90deg,#ff9a8b,#ff6a88,#ffb86c); color:#fff;
    letter-spacing:1px;
  }
  .stage{ padding:18px 20px 6px; text-align:center; }
  /* ---------- 球形国旗 ---------- */
  .globe{
    width:180px; height:180px; margin:6px auto 10px; border-radius:50%;
    position:relative; background:#eaf4ff; overflow:hidden;
    box-shadow: inset -18px -18px 38px rgba(0,0,0,.28),
                inset 12px 12px 30px rgba(255,255,255,.55),
                0 12px 26px rgba(0,0,0,.22);
    animation: bob 3.4s ease-in-out infinite;
  }
  .globe img{ width:100%; height:100%; object-fit:contain; display:block; }
  .globe .emoji{
    display:none; width:100%; height:100%; align-items:center; justify-content:center;
    font-size:96px; line-height:1;
  }
  .globe .shine{
    position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.75), rgba(255,255,255,0) 38%),
      radial-gradient(circle at 70% 78%, rgba(0,0,0,.25), rgba(0,0,0,0) 45%);
  }
  .globe .sweep{
    position:absolute; top:-40%; left:-40%; width:60%; height:180%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));
    transform:rotate(18deg); animation: sweep 4.5s linear infinite; pointer-events:none;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes sweep{ 0%{left:-50%} 100%{left:120%} }

  .word{ font-size:40px; font-weight:800; letter-spacing:.5px; margin:2px 0 0; }
  .ipa{ font-size:20px; color:var(--soft); margin:4px 0; }
  .ipa b{ color:var(--accent); font-weight:700; }
  .zh{ font-size:22px; color:var(--ink); margin-bottom:6px; }

  .controls{ display:flex; gap:10px; justify-content:center; align-items:center; margin:6px 0 2px; }
  .btn{
    border:none; border-radius:14px; padding:10px 16px; font-size:16px; cursor:pointer;
    font-family:inherit; font-weight:700; color:#fff; background:#ff9a8b;
    box-shadow:0 4px 0 #e07a6c; transition:transform .05s;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #e07a6c; }
  .btn.speak{ background:#4dabf7; box-shadow:0 4px 0 #3b8fd6; }
  .btn.ghost{ background:#fff; color:var(--soft); box-shadow:0 4px 0 #d7dbe3; }

  /* ---------- 世界地图 ---------- */
  .map-panel{ margin:0; border-radius:18px; overflow:hidden; background:#dff1ff;
              border:1px solid var(--line); position:relative; flex:1; display:flex; }
  .map-panel svg{ display:block; width:100%; height:100%; }
  .country{ fill:#bfe0ff; stroke:#fff; stroke-width:.6; }
  .country.active{ fill:#ff8787; stroke:#ff5252; stroke-width:1.2; }
  .pin{ fill:#ffd43b; stroke:#fff; stroke-width:1.5; }
  .pin-halo{ fill:#ffd43b; opacity:.35; animation: pulse 1.6s ease-out infinite; transform-origin:center; }
  .pin-label{ font-size:11px; font-weight:700; fill:#1d3557; text-anchor:middle; paint-order:stroke;
              stroke:#fff; stroke-width:2.4px; }
  @keyframes pulse{ 0%{transform:scale(.6);opacity:.5} 100%{transform:scale(2.4);opacity:0} }

  /* ---------- 练习区 ---------- */
  .practice{ padding:10px 20px 20px; }
  .progress{ text-align:center; font-size:14px; color:var(--soft); margin-bottom:8px; }
  .input-row{ display:flex; gap:8px; }
  #answer{
    flex:1; font-size:22px; padding:12px 14px; border-radius:14px; border:2px solid var(--line);
    font-family:inherit; text-align:center; outline:none; transition:border-color .15s, background .15s;
  }
  #answer:focus{ border-color:#4dabf7; }
  #answer.ok{ border-color:var(--good); background:#eafff1; }
  #answer.bad{ border-color:#ff6b6b; background:#fff0f0; animation: shake .35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  .feedback{ text-align:center; min-height:24px; margin-top:8px; font-size:16px; font-weight:700; }
  .feedback.ok{ color:var(--good); } .feedback.bad{ color:#ff6b6b; }
  .nav{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .hint-line{ text-align:center; font-size:14px; color:var(--soft); margin-top:6px; }
  .steps{ text-align:center; font-size:13px; color:var(--soft); margin-top:10px; }

  /* ---------- 语音麦克风 ---------- */
  .mic{
    display:block; margin:6px auto; width:86px; height:86px; border-radius:50%;
    border:none; cursor:pointer; color:#fff; font-size:38px; line-height:1;
    background:radial-gradient(circle at 35% 30%,#ff9a8b,#ff6a88);
    box-shadow:0 8px 20px rgba(255,106,136,.45); transition:transform .08s; position:relative;
  }
  .mic:active{ transform:scale(.94); }
  .mic.active{ animation: micpulse 1.1s ease-out infinite; background:radial-gradient(circle at 35% 30%,#ff6a88,#e23b6d); }
  @keyframes micpulse{ 0%{box-shadow:0 0 0 0 rgba(255,106,136,.55)} 100%{box-shadow:0 0 0 28px rgba(255,106,136,0)} }
  .listening{ text-align:center; font-size:16px; color:#ff6a88; font-weight:700; margin:4px 0; }
  .listening b{ color:var(--accent); }
  .heard{ text-align:center; min-height:22px; font-size:16px; color:var(--soft); margin-top:4px; }
  .heard b{ color:var(--ink); }
  .fallback{ margin-top:10px; }
  .fallback input{ width:100%; font-size:20px; padding:11px 14px; border-radius:14px; border:2px solid var(--line); text-align:center; font-family:inherit; }

  /* ---------- 庆祝 ---------- */
  #cheer{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; background:rgba(255,255,255,.82); z-index:5; border-radius:28px;
  }
  #cheer.show{ display:flex; animation: pop .3s ease; }
  #cheer .big{ font-size:46px; }
  #cheer .txt{ font-size:26px; font-weight:800; color:var(--good); margin-top:6px; }
  @keyframes pop{ from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }

  /* ---------- 开始遮罩 ---------- */
  #start{
    position:absolute; inset:0; z-index:10; background:rgba(43,45,66,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; padding:30px;
  }
  #start h2{ font-size:26px; margin:0 0 6px; }
  #start p{ font-size:15px; opacity:.85; margin:0 0 18px; line-height:1.6; }
  #start .btn{ font-size:20px; padding:14px 30px; }
  .confetti{ position:absolute; top:-10px; width:10px; height:14px; opacity:.9; border-radius:2px; }

  /* ---------- 窄屏回退：纵向堆叠 ---------- */
  @media (max-width: 860px){
    .app{ flex-direction:column; max-height:none; }
    .sidebar{ flex:none; width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:center; padding:12px; gap:8px; }
    .sidebar .brand{ width:100%; margin-bottom:0; }
    .sidebar .nav-btn{ width:auto; }
    .sidebar .tip{ display:none; }
    .col-left, .col-right{ flex:none; width:100%; }
    .col-left{ overflow:visible; }
    .col-right{ padding:0 14px 14px; }
    .map-panel{ height:210px; }
    .map-panel svg{ height:210px; }
  }
</style>
</head>

<div class="app">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="brand">🌍<br>英语小课堂</div>
    <button class="nav-btn active" id="navCountry" data-view="country"><span class="ico">🌍</span><span>国家</span></button>
    <button class="nav-btn" id="navCapital" data-view="capital"><span class="ico">🏛️</span><span>首都</span></button>
    <div class="tip">点「国家」学国名，点「首都」学各国首都的英文。</div>
  </div>

  <div class="col-left">
  <h1 id="pageTitle">🌍 国家英语小课堂</h1>

  <div class="stage">
    <div class="globe" id="globe">
      <img id="flagImg" alt="flag" />
      <div class="emoji" id="flagEmoji"></div>
      <div class="sweep"></div>
      <div class="shine"></div>
    </div>
    <div class="word" id="en">China</div>
    <div class="ipa">音标：<b id="ipa">/ˈtʃaɪnə/</b></div>
    <div class="zh" id="zh">中国</div>

    <div class="controls">
      <button class="btn speak" id="speakBtn">🔊 听发音</button>
      <button class="btn ghost" id="hintBtn">💡 提示</button>
    </div>
    <button class="mic" id="micBtn" title="点击后读出英文">🎤</button>
    <div class="listening" id="listening" style="display:none">🎧 我在听… 请说出：<b id="listenWord"></b></div>
    <div class="heard" id="heard"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="practice">
    <div class="progress" id="progress">第 1 / 100 个</div>
    <div class="hint-line" id="hintLine"></div>
    <div class="fallback" id="fallback" style="display:none">
      <input id="answer" type="text" autocomplete="off" autocorrect="off"
             placeholder="（语音不可用）在这里拼出英文…" />
    </div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn">⬅️ 上一个</button>
      <button class="btn ghost" id="shuffleBtn">🔀 打乱</button>
      <button class="btn ghost" id="nextBtn">下一个 ➡️</button>
    </div>
    <div class="steps">👂 听发音 → 🎤 读出英文 → 🎉 答对就进入下一个</div>
  </div>
  </div><!-- /col-left -->

  <div class="col-right">
    <div class="map-panel">
      <svg id="worldmap" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div><!-- /col-right -->

  <div id="cheer">
    <div class="big">🎉🎊🌟</div>
    <div class="txt">太棒了！</div>
  </div>

  <div id="start">
    <h2>👋 准备好了吗？</h2>
    <p id="startText">跟着小地球，一边看国旗一边学国家英文。<br>听完发音，把英文拼出来就好啦！</p>
    <button class="btn" id="startBtn">🚀 开始学习</button>
  </div>
</div>

const DATA = RAW.map(r=>({
  cEn:r[0], cZh:r[1], cIpa:r[2], iso:r[3], cLat:r[4], cLon:r[5], mapName:r[6],
  capEn:r[7], capZh:r[8], capIpa:r[9], capLat:r[10], capLon:r[11]
}));

/* ===================== 视图（国家 / 首都） ===================== */
let view = 'country';   // 'country' | 'capital'

/* ===================== 工具 ===================== */
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().replace(/[^a-z]/g,"");
function flagEmoji(iso){ return iso.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0))); }

/* ===================== 语音 ===================== */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){} }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.05;
    const v = voices.find(v=>/en[-_]US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ===================== 状态 ===================== */
let order = DATA.map((_,i)=>i);
let pos = 0;
let locked = false;

function current(){
  const d = DATA[order[pos]];
  if(view === 'capital'){
    return { en:d.capEn, zh:d.capZh, ipa:d.capIpa, iso:d.iso, lat:d.capLat, lon:d.capLon, mapName:d.mapName };
  }
  return { en:d.cEn, zh:d.cZh, ipa:d.cIpa, iso:d.iso, lat:d.cLat, lon:d.cLon, mapName:d.mapName };
}

/* ===================== 标签（随视图变化） ===================== */
function applyViewLabels(){
  if(view === 'capital'){
    $('pageTitle').textContent = '🏛️ 首都英语小课堂';
    $('startText').innerHTML = '跟着小地球，一边看国旗一边学首都英文。<br>听完发音，把首都英文拼出来就好啦！';
    $('answer').placeholder = '（语音不可用）在这里拼出英文首都名…';
  }else{
    $('pageTitle').textContent = '🌍 国家英语小课堂';
    $('startText').innerHTML = '跟着小地球，一边看国旗一边学国家英文。<br>听完发音，把英文拼出来就好啦！';
    $('answer').placeholder = '（语音不可用）在这里拼出英文国名…';
  }
}

/* ===================== 渲染 ===================== */
function render(){
  const c = current();
  locked = false;

  // 球形国旗（始终显示所属国家国旗）
  const img = $('flagImg'), em = $('flagEmoji');
  img.style.display = 'block'; em.style.display = 'none';
  img.onerror = () => { img.style.display='none'; em.style.display='flex'; em.textContent = flagEmoji(c.iso); };
  img.src = `https://flagcdn.com/w320/${c.iso}.png`;

  $('en').textContent = c.en;
  $('ipa').textContent = `/${c.ipa}/`;
  $('zh').textContent = c.zh;
  $('progress').textContent = `第 ${pos+1} / ${order.length} 个`;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('hintLine').textContent = '';

  const ans = $('answer');
  if(ans){ ans.value = ''; ans.disabled = false; ans.className = ''; }
  stopListeningUI();
  $('heard').textContent = '';
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  if($('fallback').style.display !== 'block') $('hintLine').textContent = '';

  renderMap();
  speak(c.en);
}

/* ===================== 世界地图 (d3 + topojson) ===================== */
const MAP_W = 800, MAP_H = 400;
let mapReady = false, projection, path, gMap, gPin, pin, pinHalo, pinLabel, features = [];

async function initMap(){
  try{
    const topo = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json());
    features = topojson.feature(topo, topo.objects.countries).features;
    projection = d3.geoEquirectangular().fitSize([MAP_W, MAP_H], {type:'Sphere'});
    path = d3.geoPath(projection);
    const svg = d3.select('#worldmap');
    gMap = svg.append('g');
    gMap.selectAll('path').data(features).join('path').attr('d', path).attr('class','country');
    gPin = svg.append('g');
    pinHalo = gPin.append('circle').attr('class','pin-halo').attr('r',9);
    pin = gPin.append('circle').attr('class','pin').attr('r',5);
    pinLabel = gPin.append('text').attr('class','pin-label');
    mapReady = true;
    renderMap();
  }catch(e){
    console.warn('map load failed', e);
  }
}

function renderMap(){
  if(!mapReady) return;
  const c = current();
  gMap.selectAll('path').attr('class', d => d.properties.name === c.mapName ? 'country active' : 'country');
  const p = projection([c.lon, c.lat]);
  if(p){
    pin.attr('cx', p[0]).attr('cy', p[1]);
    pinHalo.attr('cx', p[0]).attr('cy', p[1]);
    pinLabel.attr('x', p[0]).attr('y', p[1]-12).text(c.en);
  }
}

/* ===================== 答题逻辑 ===================== */
function voiceCheck(transcript){
  if(locked) return;
  const c = current();
  const t = norm(transcript);
  if(t && (t === norm(c.en) || t.includes(norm(c.en)))){
    locked = true;
    const fb = $('feedback'); fb.textContent = '✅ 读对啦！'; fb.className = 'feedback ok';
    cheer();
    setTimeout(() => { if(pos < order.length-1){ pos++; render(); } else { finish(); } }, 1400);
  }else{
    const fb = $('feedback'); fb.textContent = '再试试看～ 跟着发音读'; fb.className = 'feedback bad';
    if(!$('hintLine').textContent) showHint();
  }
}

/* ---------- 语音识别 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false;
function stopListeningUI(){ $('micBtn').classList.remove('active'); $('listening').style.display = 'none'; }
function escapeHtml(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
if(SR){
  recog = new SR();
  recog.lang = 'en-US'; recog.interimResults = false; recog.maxAlternatives = 1;
  recog.onstart = () => { listening = true; $('micBtn').classList.add('active'); $('listening').style.display = 'block'; $('listenWord').textContent = current().en; $('heard').textContent = ''; };
  recog.onresult = (e) => { const txt = e.results[0][0].transcript; $('heard').innerHTML = '我听到：<b>' + escapeHtml(txt) + '</b>'; voiceCheck(txt); };
  recog.onerror = (e) => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed') $('heard').textContent = '麦克风没打开权限哦，请在浏览器允许使用麦克风。';
    else if(e.error === 'no-speech') $('heard').textContent = '没听清，再试一次吧';
    else $('heard').textContent = '语音出错了：' + e.error;
  };
  recog.onend = () => { listening = false; stopListeningUI(); };
}else{
  $('fallback').style.display = 'block';
  $('hintLine').textContent = '当前浏览器不支持语音识别，可用键盘输入代替。';
}

function showHint(){
  const c = current();
  const first = c.en.replace(/[^A-Za-z]/g,'')[0] || '';
  $('hintLine').textContent = `💡 提示：第一个字母是「${first.toUpperCase()}」`;
}

function cheer(){
  const el = $('cheer'); el.classList.add('show');
  // 撒花
  for(let i=0;i<18;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + '%';
    c.style.background = ['#ff7a59','#4dabf7','#ffd43b','#22c55e','#ff6a88'][i%5];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    el.appendChild(c);
    const dur = 800 + Math.random()*700;
    c.animate([{transform:`translateY(0) rotate(0)`,opacity:1},{transform:`translateY(${200+Math.random()*120}px) rotate(${360}deg)`,opacity:0}],
      {duration:dur, easing:'ease-in'});
    setTimeout(()=>c.remove(), dur);
  }
  setTimeout(()=>el.classList.remove('show'), 1300);
}

function finish(){
  const el = $('cheer');
  el.querySelector('.big').textContent = '🏆🎉🌟';
  el.querySelector('.txt').textContent = '全部学完啦！';
  el.classList.add('show');
  const a = $('answer'); if(a) a.disabled = true;
  const msg = view === 'capital' ? 'Great job! You finished all the capitals!' : 'Great job! You finished all the countries!';
  speak(msg);
  setTimeout(()=>{
    el.classList.remove('show');
    el.querySelector('.big').textContent = '🎉🎊🌟';
    el.querySelector('.txt').textContent = '太棒了！';
    pos = 0; render();
  }, 2600);
}

function shuffle(){
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  pos = 0; render();
}

/* ===================== 视图切换 ===================== */
function switchView(v){
  if(v === view) return;
  view = v;
  pos = 0;
  $('navCountry').classList.toggle('active', v === 'country');
  $('navCapital').classList.toggle('active', v === 'capital');
  applyViewLabels();
  render();
}

/* ===================== 事件 ===================== */
$('micBtn').addEventListener('click', () => {
  if(!recog) return;
  if(listening){ try{ recog.stop(); }catch(e){} return; }
  try{ recog.start(); }catch(e){}
});
$('speakBtn').addEventListener('click', () => speak(current().en));
$('hintBtn').addEventListener('click', showHint);
$('prevBtn').addEventListener('click', () => { if(pos>0){ pos--; render(); } });
$('nextBtn').addEventListener('click', () => { if(pos<order.length-1){ pos++; render(); } });
$('shuffleBtn').addEventListener('click', shuffle);
$('navCountry').addEventListener('click', () => switchView('country'));
$('navCapital').addEventListener('click', () => switchView('capital'));

$('startBtn').addEventListener('click', () => {
  $('start').style.display = 'none';
  render();
});

applyViewLabels();
initMap();
</script>
